<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RutaUsegura - Botón SOS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    h1 { margin-bottom: 4px; }
    p { color: #555; margin-top: 0; padding: 0 16px; }

    /* Anillo que se llena mientras se mantiene presionado */
    .anillo {
      --p: 0;
      width: 244px;
      height: 244px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: conic-gradient(#1b7f3b calc(var(--p) * 1%), #d9d9d9 0);
      margin: 24px 0;
    }

    #btn-sos {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      background: #d62828;
      color: #fff;
      font-size: 48px;
      font-weight: bold;
      cursor: pointer;
      margin: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    #btn-sos:focus-visible { outline: 4px solid #1d3557; outline-offset: 4px; }
    #btn-sos:disabled { background: #999; cursor: not-allowed; }

    #mensaje { font-size: 18px; min-height: 28px; padding: 0 16px; }
    .ok { color: #1b7f3b; }
    .error { color: #b00020; }
    a { color: #1d3557; font-size: 14px; }
  </style>
</head>
<body>
  <h1>RutaUsegura</h1>
  <p>Mantén presionado el botón 2 segundos si estás en peligro</p>

  <div class="anillo" id="anillo">
    <button id="btn-sos" aria-describedby="mensaje">SOS</button>
  </div>
  <div id="mensaje" role="status" aria-live="polite"></div>
  <p><a href="/salir">Cerrar sesión / registrar otra persona</a></p>

  <script>
    const DURACION_MS = 2000;
    const boton = document.getElementById("btn-sos");
    const anillo = document.getElementById("anillo");
    const mensaje = document.getElementById("mensaje");

    let inicio = null;
    let cuadro = null;

    function mostrar(texto, clase) {
      mensaje.textContent = texto;
      mensaje.className = clase;
    }

    function pintar(porcentaje) {
      anillo.style.setProperty("--p", porcentaje);
    }

    async function enviarAlerta(latitud, longitud) {
      try {
        const respuesta = await fetch("/sos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ latitud, longitud })
        });
        const datos = await respuesta.json();
        if (datos.ok) {
          mostrar("Alerta enviada. Identificador: " + datos.id_alerta, "ok");
        } else {
          mostrar(datos.mensaje, "error");
        }
      } catch (e) {
        mostrar("La operación no pudo completarse. La alerta no fue enviada.", "error");
      }
      boton.disabled = false;
      pintar(0);
    }

    function disparar() {
      boton.disabled = true;
      mostrar("Obteniendo ubicación...", "");

      if (!navigator.geolocation) {
        mostrar("Tu navegador no permite obtener la ubicación.", "error");
        boton.disabled = false;
        pintar(0);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => enviarAlerta(pos.coords.latitude, pos.coords.longitude),
        () => {
          mostrar("No se pudo obtener la ubicación. Activa el permiso e intenta de nuevo.", "error");
          boton.disabled = false;
          pintar(0);
        }
      );
    }

    function paso(ahora) {
      if (inicio === null) return;
      const progreso = Math.min(Math.max((ahora - inicio) / DURACION_MS, 0), 1);
      pintar(progreso * 100);
      if (progreso >= 1) {
        inicio = null;
        cuadro = null;
        disparar();
      } else {
        cuadro = requestAnimationFrame(paso);
      }
    }

    function comenzar() {
      if (boton.disabled || inicio !== null) return;
      inicio = performance.now();
      mostrar("Sigue presionando...", "");
      cuadro = requestAnimationFrame(paso);
    }

    function cancelar() {
      if (inicio === null) return;
      cancelAnimationFrame(cuadro);
      inicio = null;
      cuadro = null;
      pintar(0);
      mostrar("Mantén presionado 2 segundos para enviar la alerta.", "");
    }

    // Mouse y pantalla táctil
    boton.addEventListener("pointerdown", comenzar);
    boton.addEventListener("pointerup", cancelar);
    boton.addEventListener("pointerleave", cancelar);
    boton.addEventListener("pointercancel", cancelar);
    boton.addEventListener("contextmenu", (e) => e.preventDefault());

    // Teclado (Espacio o Enter), para accesibilidad
    boton.addEventListener("keydown", (e) => {
      if ((e.key === " " || e.key === "Enter") && !e.repeat) {
        e.preventDefault();
        comenzar();
      }
    });
    boton.addEventListener("keyup", (e) => {
      if (e.key === " " || e.key === "Enter") cancelar();
    });
    boton.addEventListener("blur", cancelar);
  </script>
</body>
</html>
